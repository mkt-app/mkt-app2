<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fffaf8">
<title>ふせん日和｜勉強計画</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--ink:#514b58;--muted:#918995;--paper:#fffdfb;--line:#eee7e8;--pink:#f8dfe6;--lav:#e9e2f8;--blue:#dceefa;--mint:#dff1e8;--yellow:#fff1c9;--shadow:0 8px 24px #786b7510}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fffaf8,#f8f7ff 55%,#f5fbfa);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:9px 13px;background:#f5edf0}button.primary{background:#eecfda}button.soft{background:#f4f0f8}button.danger{background:#fae7e7;color:#9d5555}.wrap{max-width:1180px;margin:auto;padding:22px 18px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.flower{font-size:30px}.brand h1{font-size:23px;margin:0;letter-spacing:.05em}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.countdown{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 15px;text-align:right;box-shadow:var(--shadow);font-size:12px;color:var(--muted)}.countdown strong{display:block;color:#a96f85;font-size:20px}
nav{display:flex;gap:8px;overflow:auto;padding:4px 0 14px}nav button{white-space:nowrap;background:#fff;border:1px solid var(--line)}nav button.active{background:#f5e3e9;border-color:#edcbd7}
.panel{background:#ffffffd9;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}.panel h2{font-size:18px;margin:0 0 5px}.sub{font-size:12px;color:var(--muted);margin:0 0 16px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.toolbar .spacer{flex:1}
input,select,textarea{background:#fff;border:1px solid #e9e1e5;border-radius:10px;padding:9px 10px;min-width:0}input[type=color]{padding:3px;width:42px;height:38px}input[type=checkbox]{accent-color:#bd8da0}.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.subject{border:1px solid var(--line);border-top:5px solid var(--subject);border-radius:16px;padding:13px;background:#fff}.subject-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}.subject-head strong{flex:1}.notes{display:grid;gap:9px}.note{background:var(--note);border:1px solid #ffffff;border-radius:12px;padding:11px;cursor:grab;box-shadow:0 3px 10px #62505c0d;touch-action:pan-y}.note.dragging{opacity:.45}.note h4{margin:0 0 7px;font-size:14px}.note ul{list-style:none;padding:0;margin:0;display:grid;gap:5px}.note li{font-size:12px;display:flex;gap:6px;align-items:center}.note li input{margin:0}.progress{height:5px;background:#ffffffb8;border-radius:10px;margin-top:9px;overflow:hidden}.progress span{display:block;height:100%;background:#b98da2;border-radius:10px}.note-foot{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:#7d7480}.note-foot input{width:48px;padding:4px}.note-actions{display:flex;gap:5px;margin-top:8px}.note-actions button{font-size:11px;padding:5px 8px}
.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.weekday{text-align:center;color:var(--muted);font-size:11px;padding:5px}.day{min-height:142px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px;min-width:0}.day.today{outline:2px solid #d9a8bb}.day.test{background:#fff8fb;border-color:#e9bdce}.day.other{opacity:.45}.day-num{font-size:12px;font-weight:700;display:flex;justify-content:space-between}.day-items{display:grid;gap:4px;margin-top:6px}.event{font-size:10px;border-radius:7px;padding:4px 5px;overflow-wrap:anywhere;background:#f4eaf0}.event.study{background:#e9e3f7;cursor:pointer}.event.fixed{background:#e0f1e9}.event.test{background:#ffe8d5}.drop-hint{font-size:10px;color:#aaa;margin-top:5px}
.formrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.formrow input[type=text]{flex:1;min-width:130px}.listrow{display:flex;gap:8px;align-items:center;padding:9px;border-bottom:1px solid var(--line);font-size:13px}.listrow span{flex:1}.empty{color:#a39ba5;font-size:13px;padding:14px;text-align:center}.modal-bg{position:fixed;inset:0;background:#514b5866;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-bg.show{display:flex}.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:#fffdfb;border-radius:20px;padding:18px;box-shadow:0 20px 60px #32273733}.modal h3{margin:0 0 12px}.modal label{display:grid;gap:5px;font-size:12px;margin:9px 0}.modal textarea{min-height:90px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
footer{text-align:center;color:#a59ca6;font-size:11px;padding:18px}
@media(max-width:700px){.wrap{padding:15px 11px 45px}.brand h1{font-size:19px}.countdown{padding:8px 10px}.panel{padding:13px}.calendar{gap:3px}.day{min-height:112px;padding:4px;border-radius:8px}.day-num{font-size:10px}.event{font-size:9px;padding:3px}.weekday{font-size:10px}.subjects{grid-template-columns:1fr}.toolbar input{max-width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand"><div class="flower">✿</div><div><h1>ふせん日和</h1><p>小さな一歩を、今日の予定に。</p></div></div><div class="countdown" id="countdown">テスト日を設定してね<strong>—</strong></div></header>
<nav id="nav"><button class="active" data-page="tasks">付箋リスト</button><button data-page="calendar">スケジュール帳</button><button data-page="tests">テスト日程</button><button data-page="settings">設定・バックアップ</button></nav>
<main id="main"></main>
<footer>✿ ふせん日和 · 勉強計画はこの端末のブラウザに保存されます ✿</footer>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<script>
const KEY='fusenn-biyori-v1';
const defaultData={subjects:[{id:id(),name:'数学',color:'#e9def8',notes:[]},{id:id(),name:'英語',color:'#dceefa',notes:[]},{id:id(),name:'国語',color:'#f8dfe6',notes:[]},{id:id(),name:'理科',color:'#dff1e8',notes:[]},{id:id(),name:'社会',color:'#fff1c9',notes:[]}],tests:[],rangeStart:'',rangeEnd:'',fixed:[],plans:[]};
function id(){return Math.random().toString(36).slice(2,10)}
let data;try{data=JSON.parse(localStorage.getItem(KEY))||defaultData}catch{data=defaultData}
let page='tasks', calendarStart=null, dragNote=null, touchTimer=null, touchNode=null;
function save(){localStorage.setItem(KEY,JSON.stringify(data));renderHeader()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateObj(s){return s?new Date(s+'T12:00:00'):null}
function fmt(s){let d=dateObj(s);return d?`${d.getMonth()+1}/${d.getDate()}(${['日','月','火','水','木','金','土'][d.getDay()]})`:''}
function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function renderHeader(){let upcoming=data.tests.map(t=>t.date).filter(Boolean).sort()[0];let el=document.getElementById('countdown');if(!upcoming){el.innerHTML='テスト日を設定してね<strong>—</strong>';return}let diff=Math.ceil((dateObj(upcoming)-dateObj(today()))/86400000);el.innerHTML=`テストまであと<strong>${diff>=0?diff+'日':'終了！'}</strong>`}
function setPage(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});
function render(){renderHeader();let m=document.getElementById('main');m.innerHTML=page==='tasks'?tasksPage():page==='calendar'?calendarPage():page==='tests'?testsPage():settingsPage();bindPage()}
function tasksPage(){return `<section class="panel"><h2>科目と勉強付箋</h2><p class="sub">付箋をカレンダーにドラッグして、勉強する日に置こう。</p><div class="toolbar"><button class="primary" id="addSubject">＋ 科目を追加</button><span class="spacer"></span><span class="sub">付箋は長押し・ドラッグで移動できるよ</span></div><div class="subjects">${data.subjects.map(s=>`<article class="subject" style="--subject:${s.color}"><div class="subject-head"><strong>${esc(s.name)}</strong><input type="color" value="${s.color}" data-color="${s.id}" title="科目の色"><button data-edit-sub="${s.id}">編集</button><button class="danger" data-del-sub="${s.id}">削除</button></div><div class="notes">${s.notes.map(n=>noteHTML(s,n)).join('')||'<div class="empty">まだ付箋がないよ</div>'}</div><button class="soft" style="width:100%;margin-top:9px" data-add-note="${s.id}">＋ 付箋を追加</button></article>`).join('')}</div></section>`}
function noteHTML(s,n){let done=n.items.filter(x=>x.done).length,total=n.items.length;return `<div class="note" draggable="true" data-note="${n.id}" data-subject="${s.id}" style="--note:${s.color}55"><h4>${esc(n.title)}</h4><ul>${n.items.map((x,i)=>`<li><input type="checkbox" data-check="${n.id}" data-index="${i}" ${x.done?'checked':''}><span>${esc(x.text)}</span></li>`).join('')||'<li class="empty">項目を追加してね</li>'}</ul><div class="note-foot"><span>進捗</span><input type="number" min="0" value="${n.achieved||0}" data-achieved="${n.id}"> / <input type="number" min="1" value="${n.total||1}" data-total="${n.id}"><span>${esc(n.unit||'ページ')}</span><span style="margin-left:auto">${n.total?Math.round((n.achieved||0)/n.total*100):0}%</span></div><div class="progress"><span style="width:${Math.min(100,n.total?100*(n.achieved||0)/n.total:0)}%"></span></div><div class="note-actions"><button data-edit-note="${n.id}" data-parent="${s.id}">編集</button><button data-done-note="${n.id}" data-parent="${s.id}">${n.completed?'✓ 完了済み':'完了にする'}</button><button class="danger" data-del-note="${n.id}" data-parent="${s.id}">削除</button></div></div>`}
function calendarPage(){let start=data.rangeStart||today(),end=data.rangeEnd||addDays(start,20);let days=[];for(let d=dateObj(start),last=dateObj(end);d<=last;d.setDate(d.getDate()+1))days.push(new Date(d));let first=new Date(days[0]);let offset=first.getDay();let cells=Array(offset).fill(null).concat(days);while(cells.length%7)cells.push(null);
return `<section class="panel"><div class="calendar-head"><div><h2>スケジュール帳</h2><p class="sub">勉強期間：${fmt(start)} 〜 ${fmt(end)} · 付箋を日付にドロップ</p></div><div class="toolbar"><button id="prevRange">← 1週</button><button id="nextRange">1週 →</button></div></div><div class="calendar">${['日','月','火','水','木','金','土'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells.map(d=>{if(!d)return '<div></div>';let ds=iso(d),isToday=ds===today(),tests=data.tests.filter(t=>t.date===ds),fixed=data.fixed.filter(x=>x.date===ds),plans=data.plans.filter(x=>x.date===ds);return `<div class="day ${isToday?'today':''} ${tests.length?'test':''}" data-day="${ds}"><div class="day-num">${d.getDate()}日 ${isToday?'<span>今日</span>':''}</div><div class="day-items">${tests.map(t=>`<div class="event test">✿ ${esc(t.subject||'テスト')}</div>`).join('')}${fixed.map(f=>`<div class="event fixed">${esc(f.start||'')} ${esc(f.title)}</div>`).join('')}${plans.map(p=>{let n=findNote(p.noteId);return `<div class="event study" title="クリックで削除">${n?esc(n.title):'付箋'} <small>×</small></div>`}).join('')}</div><div class="drop-hint">＋ ここにドロップ</div><button style="font-size:10px;padding:3px 5px;margin-top:4px" data-add-fixed="${ds}">＋予定</button></div>`}).join('')}</div></section>`}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function addDays(s,n){let d=dateObj(s);d.setDate(d.getDate()+n);return iso(d)}
function findNote(nid){for(let s of data.subjects){let n=s.notes.find(x=>x.id===nid);if(n)return n}return null}
function testsPage(){return `<section class="panel"><h2>テスト日程</h2><p class="sub">テストがある日だけ追加してね。1〜3時間目は空欄でもOK。</p><div class="toolbar"><button class="primary" id="addTest">＋ テスト日を追加</button></div>${data.tests.map(t=>`<div class="listrow"><span><strong>${fmt(t.date)}</strong>　${[t.p1,t.p2,t.p3].filter(Boolean).map(esc).join(' · ')||'科目未設定'}</span><button data-edit-test="${t.id}">編集</button><button class="danger" data-del-test="${t.id}">削除</button></div>`).join('')||'<div class="empty">テスト日程はまだないよ</div>'}</section><section class="panel"><h2>勉強期間</h2><p class="sub">テスト日から逆算して、勉強する期間を自由に決められるよ。</p><div class="formrow"><label>開始日 <input type="date" id="rangeStart" value="${data.rangeStart}"></label><label>終了日 <input type="date" id="rangeEnd" value="${data.rangeEnd}"></label><button class="primary" id="saveRange">期間を保存</button></div></section>`}
function settingsPage(){return `<section class="panel"><h2>固定予定（勉強付箋とは別枠）</h2><p class="sub">塾・習い事など、あらかじめ決まっている予定を登録できるよ。</p><button class="primary" id="addFixed">＋ 固定予定を追加</button>${data.fixed.map(f=>`<div class="listrow"><span>${fmt(f.date)}　${esc(f.start)}〜${esc(f.end)}　<strong>${esc(f.title)}</strong></span><button data-del-fixed="${f.id}" class="danger">削除</button></div>`).join('')||'<div class="empty">固定予定はまだないよ</div>'}</section><section class="panel"><h2>バックアップ</h2><p class="sub">データはこのブラウザ内に保存されるよ。機種変更やブラウザのデータ削除に備えて、ときどき書き出してね。</p><div class="toolbar"><button class="primary" id="export">データを書き出す</button><label class="soft" style="padding:9px 13px;border-radius:12px;cursor:pointer">データを読み込む<input type="file" id="import" accept="application/json" hidden></label></div></section>`}
function bindPage(){document.getElementById('addSubject')?.addEventListener('click',()=>subjectModal());document.querySelectorAll('[data-add-note]').forEach(b=>b.onclick=()=>noteModal(b.dataset.addNote));document.querySelectorAll('[data-edit-sub]').forEach(b=>b.onclick=()=>subjectModal(b.dataset.editSub));document.querySelectorAll('[data-del-sub]').forEach(b=>b.onclick=()=>{if(confirm('この科目と付箋を削除する？')){data.subjects=data.subjects.filter(s=>s.id!==b.dataset.delSub);save();render()}});document.querySelectorAll('[data-color]').forEach(i=>i.onchange=()=>{let s=data.subjects.find(x=>x.id===i.dataset.color);s.color=i.value;save();render()});
document.querySelectorAll('[data-edit-note]').forEach(b=>b.onclick=()=>noteModal(b.dataset.parent,b.dataset.editNote));document.querySelectorAll('[data-del-note]').forEach(b=>b.onclick=()=>{if(confirm('この付箋を削除する？')){let s=data.subjects.find(x=>x.id===b.dataset.parent);s.notes=s.notes.filter(n=>n.id!==b.dataset.delNote);data.plans=data.plans.filter(p=>p.noteId!==b.dataset.delNote);save();render()}});document.querySelectorAll('[data-done-note]').forEach(b=>b.onclick=()=>{let n=findNote(b.dataset.doneNote);n.completed=!n.completed;save();render()});document.querySelectorAll('[data-check]').forEach(i=>i.onchange=()=>{let n=findNote(i.dataset.check);n.items[+i.dataset.index].done=i.checked;save();render()});document.querySelectorAll('[data-achieved],[data-total]').forEach(i=>i.onchange=()=>{let n=findNote(i.dataset.achieved||i.dataset.total);if(i.dataset.achieved)n.achieved=Math.max(0,+i.value||0);else n.total=Math.max(1,+i.value||1);save();render()});
document.querySelectorAll('.note[draggable=true]').forEach(el=>{el.addEventListener('dragstart',()=>{dragNote=el.dataset.note;el.classList.add('dragging')});el.addEventListener('dragend',()=>el.classList.remove('dragging'));el.addEventListener('touchstart',()=>{touchNode=el;touchTimer=setTimeout(()=>{dragNote=el.dataset.note;el.style.opacity='.5'},450)},{passive:true});el.addEventListener('touchend',()=>clearTimeout(touchTimer),{passive:true})});
document.querySelectorAll('[data-day]').forEach(day=>{day.addEventListener('dragover',e=>e.preventDefault());day.addEventListener('drop',e=>{e.preventDefault();if(dragNote){data.plans.push({id:id(),noteId:dragNote,date:day.dataset.day});save();render();dragNote=null}});day.addEventListener('click',e=>{let event=e.target.closest('.event.study');if(event){let plans=data.plans.filter(p=>p.date===day.dataset.day);let idx=[...day.querySelectorAll('.event.study')].indexOf(event);let p=plans[idx];if(p&&confirm('この日の付箋予定を外す？')){data.plans=data.plans.filter(x=>x.id!==p.id);save();render()}}})});
document.querySelectorAll('[data-add-fixed]').forEach(b=>b.onclick=()=>fixedModal(b.dataset.addFixed));document.getElementById('addFixed')?.addEventListener('click',()=>fixedModal(today()));document.getElementById('addTest')?.addEventListener('click',()=>testModal());document.querySelectorAll('[data-edit-test]').forEach(b=>b.onclick=()=>testModal(b.dataset.editTest));document.querySelectorAll('[data-del-test]').forEach(b=>b.onclick=()=>{data.tests=data.tests.filter(t=>t.id!==b.dataset.delTest);save();render()});document.getElementById('saveRange')?.addEventListener('click',()=>{data.rangeStart=document.getElementById('rangeStart').value;data.rangeEnd=document.getElementById('rangeEnd').value;save();setPage('calendar')});document.getElementById('prevRange')?.addEventListener('click',()=>{data.rangeStart=addDays(data.rangeStart||today(),-7);data.rangeEnd=addDays(data.rangeEnd||today(),-7);save();render()});document.getElementById('nextRange')?.addEventListener('click',()=>{data.rangeStart=addDays(data.rangeStart||today(),7);data.rangeEnd=addDays(data.rangeEnd||today(),7);save();render()});document.querySelectorAll('[data-del-fixed]').forEach(b=>b.onclick=()=>{data.fixed=data.fixed.filter(f=>f.id!==b.dataset.delFixed);save();render()});document.getElementById('export')?.addEventListener('click',exportData);document.getElementById('import')?.addEventListener('change',importData)}
function showModal(title,body,onSave){let bg=document.getElementById('modalBg'),m=document.getElementById('modal');m.innerHTML=`<h3>${title}</h3>${body}<div class="modal-actions"><button id="cancelModal">キャンセル</button><button class="primary" id="saveModal">保存</button></div>`;bg.classList.add('show');document.getElementById('cancelModal').onclick=()=>bg.classList.remove('show');document.getElementById('saveModal').onclick=()=>{if(onSave()!==false){bg.classList.remove('show');save();render()}}}
function subjectModal(sid){let s=data.subjects.find(x=>x.id===sid);showModal('科目',`<label>科目名<input id="mName" value="${esc(s?.name||'')}" placeholder="例：数学"></label><label>色<input type="color" id="mColor" value="${s?.color||'#e9def8'}"></label>`,()=>{let name=document.getElementById('mName').value.trim();if(!name)return false;if(s){s.name=name;s.color=document.getElementById('mColor').value}else data.subjects.push({id:id(),name,color:document.getElementById('mColor').value,notes:[]})})}
function noteModal(sid,nid){let s=data.subjects.find(x=>x.id===sid),n=s.notes.find(x=>x.id===nid);showModal('勉強付箋',`<label>タイトル<input id="mTitle" value="${esc(n?.title||'')}" placeholder="例：数学ワーク"></label><label>やること（1行に1項目）<textarea id="mItems" placeholder="例：P.10〜15&#10;間違えた問題を解き直す">${esc((n?.items||[]).map(x=>x.text).join('\n'))}</textarea></label><div class="formrow"><label>達成数<input id="mAch" type="number" min="0" value="${n?.achieved||0}"></label><label>全体数<input id="mTotal" type="number" min="1" value="${n?.total||1}"></label><label>単位<select id="mUnit">${['ページ','問','単語','時間','回','枚'].map(u=>`<option ${n?.unit===u?'selected':''}>${u}</option>`).join('')}</select></label></div>`,()=>{let title=document.getElementById('mTitle').value.trim();if(!title)return false;let obj={id:n?.id||id(),title,items:document.getElementById('mItems').value.split('\n').map(x=>x.trim()).filter(Boolean).map((text,i)=>({text,done:n?.items?.find(y=>y.text===text)?.done||false})),achieved:+document.getElementById('mAch').value||0,total:Math.max(1,+document.getElementById('mTotal').value||1),unit:document.getElementById('mUnit').value,completed:n?.completed||false};if(n)Object.assign(n,obj);else s.notes.push(obj)})}
function fixedModal(date){showModal('固定予定',`<label>予定名<input id="mTitle" placeholder="例：塾"></label><label>日付<input id="mDate" type="date" value="${date}"></label><div class="formrow"><label>開始<input id="mStart" type="time" value="18:00"></label><label>終了<input id="mEnd" type="time" value="20:00"></label></div>`,()=>{let title=document.getElementById('mTitle').value.trim();if(!title)return false;data.fixed.push({id:id(),title,date:document.getElementById('mDate').value,start:document.getElementById('mStart').value,end:document.getElementById('mEnd').value})})}
function testModal(tid){let t=data.tests.find(x=>x.id===tid);showModal('テスト日程',`<label>日付<input id="mDate" type="date" value="${t?.date||today()}"></label>${[1,2,3].map(i=>`<label>${i}時間目<select id="mP${i}"><option value="">なし</option>${data.subjects.map(s=>`<option ${t?.['p'+i]===s.name?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>`).join('')}`,()=>{let date=document.getElementById('mDate').value;if(!date)return false;let obj={id:t?.id||id(),date,p1:document.getElementById('mP1').value,p2:document.getElementById('mP2').value,p3:document.getElementById('mP3').value};if(t)Object.assign(t,obj);else data.tests.push(obj);data.tests.sort((a,b)=>a.date.localeCompare(b.date))})}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ふせん日和バックアップ.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.subjects||!Array.isArray(x.subjects))throw 0;if(confirm('現在のデータを読み込んだデータで置き換える？')){data=x;save();render()}}catch{alert('読み込めないファイルです')}};r.readAsText(f);e.target.value=''}
render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
